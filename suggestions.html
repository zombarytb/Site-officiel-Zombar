<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - ZOMBAR</title>

    <link rel="icon" type="image/jpeg" href="logo.jpg?v=11">
    <link rel="apple-touch-icon" href="logo.jpg?v=11">
    <link rel="shortcut icon" href="logo.jpg?v=11">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Urbanist:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

    <div class="glow-overlay">
        <div class="glow-green"></div>
        <div class="glow-orange"></div>
        <div class="glow-blue"></div>
    </div>

    <header class="site-header">
        <div class="signature-container">
            <a href="index.html"><img src="signature.png" alt="Signature Zombar" class="signature-img"></a>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">Contact & Suggestions</h1>
            <p class="page-description">Propose une idée de vidéo, un jeu ou envoie un message</p>
        </div>

        <div class="navbar-container">
            <nav>
                <ul class="navbar">
                    <li class="nav-item"><a href="index.html">Accueil</a></li>
                    <li class="nav-item"><a href="jeux.html">Jeux</a></li>
                    <li class="nav-item"><a href="planning.html">Planning</a></li>
                    <li class="nav-item"><a href="setup.html">Setup</a></li>
                    <li class="nav-item"><a href="beamng.html">BeamNG</a></li>
                    <li class="nav-item"><a href="suggestions.html" class="active-nav">Contact</a></li>
                    <li class="nav-item"><a href="boutique.html">Boutique</a></li>
                </ul>
            </nav>
        </div>

        <section class="section-container">
            <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
                <form id="suggestion-form" class="contact-form">
                    <div class="form-group">
                        <label for="user-pseudo">Pseudo Discord / Web</label>
                        <input type="text" id="user-pseudo" class="form-input" placeholder="Ton pseudo..." required>
                    </div>

                    <div class="form-group">
                        <label for="suggestion-type">Catégorie</label>
                        <select id="suggestion-type" class="form-select">
                            <option value="Suggestion Jeu">Suggestion de jeu / Mod</option>
                            <option value="Idée Vidéo">Idée de vidéo YouTube</option>
                            <option value="Message">Message général</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="user-message">Message</label>
                        <textarea id="user-message" class="form-textarea" rows="5" placeholder="Ton message..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Envoyer le message</button>
                </form>

                <div id="form-feedback" style="margin-top: 15px;"></div>
            </div>
        </section>
    </main>

    <script src="script.js?v=11"></script>
</body>
</html>
